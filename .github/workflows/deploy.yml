# 本番デプロイ（スターサーバー / SSH + rsync）
#
# スターサーバー SSH: ホスト=サーバーID.stars.ne.jp（または sv***.star.ne.jp）
#   ユーザー=サーバーID / ポート=10022 / 認証=公開鍵のみ（パスワード不可）
# 本番: https://static.sho-tsukamoto.jp/tidegraph
# リモート: sho-tsukamoto.jp/public_html/static.sho-tsukamoto.jp/tidegraph/
#
# 必要な Secrets は DEPLOY.md を参照。値はリポジトリに書きません。
#
# ENABLE_AUTO_DEPLOY について:
#   job の if: で vars.* を書くと Repository Variables しか見えない。
#   Environment Variables も効かせるため、decide job で environment: production
#   を付けたうえでステップ内で判定する。

name: Deploy production

on:
  push:
    branches:
      - main
      - cursor/deploy-dry-run-446a
      - cursor/deploy-live-446a
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run（アップロードしない）"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # FTP 表記の先頭 / はアカウントホーム相対。SSH/rsync では先頭スラッシュ無しが正しい。
  DEFAULT_REMOTE_DIR: sho-tsukamoto.jp/public_html/static.sho-tsukamoto.jp/tidegraph/
  DEFAULT_PROD_BASE: https://static.sho-tsukamoto.jp/tidegraph
  DEFAULT_SSH_PORT: "10022"

jobs:
  decide:
    name: Decide deploy
    runs-on: ubuntu-latest
    # Environment vars は job 開始後に見える。ここを付けないと
    # Environment production 側の ENABLE_AUTO_DEPLOY が参照できない。
    environment: production
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Evaluate deploy gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # environment: production 付き job では repo + environment の vars が見える
          ENABLE_AUTO_DEPLOY: ${{ vars.ENABLE_AUTO_DEPLOY }}
        run: |
          set -euo pipefail
          # 空白・大文字小文字を正規化（"true" / "True" / " true " / "1" / "yes"）
          flag="$(printf '%s' "${ENABLE_AUTO_DEPLOY:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          deploy=false
          reason=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            deploy=true
            reason="workflow_dispatch（手動実行は常に可）"
          elif [ "$REF_NAME" = "cursor/deploy-dry-run-446a" ] || [ "$REF_NAME" = "cursor/deploy-live-446a" ]; then
            deploy=true
            reason="deploy 専用ブランチ ${REF_NAME}"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            case "$flag" in
              true|1|yes)
                deploy=true
                reason="main push + ENABLE_AUTO_DEPLOY=${ENABLE_AUTO_DEPLOY}"
                ;;
              *)
                reason="main push だが ENABLE_AUTO_DEPLOY が有効でない（生値='${ENABLE_AUTO_DEPLOY}'）。Settings → Secrets and variables → Actions → Variables（リポジトリ）または Environment production → Variables に true を設定"
                ;;
            esac
          else
            reason="未対応のトリガー event=${EVENT_NAME} ref=${REF_NAME}"
          fi

          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          echo "=== Deploy gate ==="
          echo "event=${EVENT_NAME} ref=${REF_NAME}"
          echo "ENABLE_AUTO_DEPLOY raw='${ENABLE_AUTO_DEPLOY}' normalized='${flag}'"
          echo "decision deploy=${deploy}"
          echo "reason: ${reason}"
          if [ "$deploy" != "true" ]; then
            echo "::notice::Deploy skipped: ${reason}"
          fi

  deploy:
    name: Build and SSH deploy
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USERNAME SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name が未設定です。DEPLOY.md を参照（スターサーバーは SSH 公開鍵・ポート 10022）。"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required SSH secrets are present (values not printed)."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
          coverage: none

      - name: Install Composer dependencies (CI)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Prepare deploy tree
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir .deploy
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.deploy/' \
            --exclude 'mcp-server/' \
            --exclude 'Dockerfile' \
            --exclude 'docker-compose.yml' \
            --exclude '.gitignore' \
            --exclude 'DEPLOY.md' \
            --exclude '.DS_Store' \
            --exclude '*.md' \
            ./ .deploy/
          cp -f composer.lock .deploy/composer.lock
          test -f .deploy/vendor/autoload.php
          test -f .deploy/index.php
          test -f .deploy/llms.txt
          test -f .deploy/manifest.webmanifest
          test -f .deploy/assets/js/webmcp.js
          test -d .deploy/api
          echo "Deploy tree ready ($(du -sh .deploy | cut -f1))"

      - name: Resolve remote settings
        id: remote
        run: |
          if [ -n "${{ vars.DEPLOY_REMOTE_DIR }}" ]; then
            dir="${{ vars.DEPLOY_REMOTE_DIR }}"
          else
            dir="${{ env.DEFAULT_REMOTE_DIR }}"
          fi
          case "$dir" in
            */) ;;
            *) dir="${dir}/" ;;
          esac
          # SSH では先頭 / をホーム相対に正規化
          dir="${dir#/}"
          if [ -n "${{ vars.SSH_PORT }}" ]; then
            port="${{ vars.SSH_PORT }}"
          else
            port="${{ env.DEFAULT_SSH_PORT }}"
          fi
          dry=false
          if [ "${{ github.ref_name }}" = "cursor/deploy-dry-run-446a" ]; then
            dry=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            dry=true
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "Remote dir: $dir"
          echo "SSH port: $port"
          echo "Dry run: $dry"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ steps.remote.outputs.port }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "::warning::ssh-keyscan failed; trying StrictHostKeyChecking=accept-new on connect"
          }

      - name: Ensure remote directory exists
        if: ${{ steps.remote.outputs.dry_run != 'true' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REMOTE_DIR: ${{ steps.remote.outputs.dir }}
          SSH_PORT: ${{ steps.remote.outputs.port }}
        run: |
          set -euo pipefail
          # 先頭 / は OS ルート扱いになるため除去（スターサーバー FTP パス互換）
          dir="${REMOTE_DIR#/}"
          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 \
            "${SSH_USERNAME}@${SSH_HOST}" \
            "mkdir -p -- '${dir}' && test -d '${dir}' && echo 'remote dir ready'"

      - name: Deploy via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REMOTE_DIR: ${{ steps.remote.outputs.dir }}
          SSH_PORT: ${{ steps.remote.outputs.port }}
          DRY_RUN: ${{ steps.remote.outputs.dry_run }}
        run: |
          set -euo pipefail
          dir="${REMOTE_DIR#/}"
          RSYNC_FLAGS=(-az --delete --omit-dir-times --no-perms --no-owner --no-group)
          if [ "$DRY_RUN" = "true" ]; then
            RSYNC_FLAGS+=(--dry-run --itemize-changes)
            echo "=== DRY RUN (no files will be uploaded) ==="
          else
            echo "=== LIVE DEPLOY ==="
          fi
          rsync "${RSYNC_FLAGS[@]}" \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30" \
            .deploy/ \
            "${SSH_USERNAME}@${SSH_HOST}:${dir}"
          echo "rsync finished (dry_run=${DRY_RUN})"

      - name: Smoke check (production)
        if: ${{ steps.remote.outputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          base="${{ vars.PROD_BASE_URL }}"
          if [ -z "$base" ]; then
            base="${{ env.DEFAULT_PROD_BASE }}"
          fi
          base="${base%/}"
          echo "Checking $base ..."
          code=$(curl -sS -o /tmp/prod_index.html -w '%{http_code}' --max-time 45 "$base/")
          echo "GET / -> $code"
          test "$code" = "200"
          grep -q 'シオヨミ' /tmp/prod_index.html
          if grep -q 'manifest.webmanifest' /tmp/prod_index.html; then
            mcode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base/manifest.webmanifest")
            echo "manifest -> $mcode"
            test "$mcode" = "200"
          fi
          if grep -q 'webmcp.js' /tmp/prod_index.html; then
            wcode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base/assets/js/webmcp.js")
            echo "webmcp.js -> $wcode"
            test "$wcode" = "200"
          fi
          pcode=$(curl -sS -o /tmp/places.json -w '%{http_code}' --max-time 45 "$base/api/places.php" || echo "000")
          echo "api/places.php -> $pcode"
          echo "Smoke check finished."
